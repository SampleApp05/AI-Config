schema_version = 1
id = "claude-cli"
engine = "claude-code"
display_name = "Claude Code CLI"
invocation = "claude -p --output-format json"
workspace_host = "mac"
inference_host = "anthropic"
eligible_roles = ["problem_analyst", "solution_architect", "requirements_engineer", "work_planner", "execution_router", "implementation_worker", "test_engineer", "code_reviewer"]
capabilities = ["formal-stage-artifact-authoring", "architecture", "cross-service-analysis", "implementation", "testing", "independent-review"]
permission_model = "CLI edit permission where supported; dispatcher verifies post-run scope"
health_check = "authenticated host-environment claude -p readiness check"
binary_paths = ["/Users/danielvelikov/.local/bin/claude"]
availability_policy = "check-at-dispatch"
capacity_policy = "manual-single-task"
latency_class = "medium"
cost_class = "cloud-managed"
default_fallback_chain = ["codex", "mac-ollama"]
label_prefix = "[CLAUDE]"

[permissions]
# developer: the run may use these tools freely and edit any file under write_roots (the scope markers are then verified
# after the run and reported, never blocked mid-run). scoped: edits limited to the exact scope paths and Bash to the routed
# validation commands, which denies most real work.
profile = "developer"
write_roots = ["/Users/danielvelikov/Developer"]
tools = ["Read", "Glob", "Grep", "Bash", "WebFetch", "WebSearch", "NotebookEdit"]
max_permission_denials = 3

[hard_limits]
max_files = 100
max_context_bytes = 800000
max_prompt_chars = 100000
