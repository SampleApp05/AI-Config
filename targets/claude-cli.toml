schema_version = 1
id = "claude-cli"
engine = "claude-code"
display_name = "Claude Code CLI"
invocation = "claude -p --output-format stream-json through the bounded local relay and per-dispatch explicit tool allowlist"
workspace_host = "mac"
inference_host = "anthropic"
eligible_roles = ["intake_analyst", "problem_analyst", "solution_architect", "requirements_engineer", "work_planner", "execution_router", "implementation_worker", "test_engineer", "code_reviewer"]
capabilities = ["formal-stage-artifact-authoring", "architecture", "cross-service-analysis", "implementation", "testing", "independent-review"]
permission_model = "Explicit Claude tool allowlist; Bash is artifact-stage-only and requires WORKFLOW_CLAUDE_ALLOW_BASH=true in an authorized prompt. Dispatcher verifies all changed paths after the run."
turn_budget_policy = "No automatic turn cap. Usage, scope, and explicit human decisions govern continuation."
health_check = "authenticated host-environment claude -p readiness check"
availability_policy = "check-at-dispatch"
capacity_policy = "one durable external worker; relay records bounded provider usage and stops new scheduling at the configured threshold"
latency_class = "medium"
cost_class = "cloud-managed"
default_fallback_chain = []
label_prefix = "[CLAUDE]"

[hard_limits]
max_files = 100
max_context_bytes = 800000
max_prompt_chars = 100000
