schema_version = 1

[human_gates]
stages = ["orchestration-plan-approval", "execution-approval"]
rule = "Human-gated stages are never delegated to a local or external model target."

[assignment]
required_factors = ["capability_fit", "risk", "context_size", "health", "availability", "capacity", "independence"]
record_fields = ["stage", "role", "preferred_target", "actual_target", "rationale", "fallback_chain", "health_observation", "scope"]
no_static_stage_preferences = false
rule = "Apply role preferences unless capability, usage, availability, or independence justifies a recorded fallback. For implementation and focused test-writing units, choose the actual worker after Routing and refresh health and usage immediately before dispatch."

[role_preferences]
intake_analyst = ["codex-native", "claude-cli"]
problem_analyst = ["codex-native", "claude-cli"]
solution_architect = ["claude-cli", "codex-native"]
requirements_engineer = ["codex-native", "claude-cli"]
work_planner = ["claude-cli", "codex-native"]
execution_router = ["codex-native", "claude-cli"]
execution_coordinator = ["codex-native"]
test_engineer = ["codex-native", "claude-cli"]
code_reviewer = ["codex-native", "claude-cli"]
workflow_orchestrator = ["codex-native"]

[execution]
runtime_selected_roles = ["implementation_worker"]
candidate_targets = ["mac-ollama", "windows-4070", "claude-cli", "codex-native"]
local_preference = "Prefer a healthy registered local worker for narrow, independently verifiable edits such as focused tests. Keep formal Test validation with an independent cloud agent."
fallback_rule = "Use only a plan-approved fallback, record the reason and actual target, and preserve review independence."

[independence]
cloud_implementation_review = "Prefer Codex review after Claude implementation and Claude review after Codex implementation. For local implementation, use an independent cloud reviewer. Do not let an implementation worker review its own changes."

[workflow_modes]
delivery = ["handoff", "plan-gate", "definition", "architecture", "requirements", "decomposition", "routing", "execution-gate", "execution", "test", "review", "report"]
evaluation = ["handoff", "plan-gate", "definition", "architecture", "requirements", "evaluation-test", "evaluation-review", "report"]

[scope]
rule = "Artifact authoring writes only the exact assigned artifact path. Execution writes only recorded allowed files. A post-run diff violation fails the dispatch."
