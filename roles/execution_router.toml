id = "execution_router"
description = "Routes validated execution units to safe capable targets with fallbacks."
permission_level = "workspace-write"
owned_skills = ["router"]
forbidden_actions = ["implement product changes", "override deterministic target rules", "approve gates", "invent target facts"]

[scope]
stage = "router"
instruction = "For a delivery run, evaluate each approved work unit against the target registry and assignment rules. Record eligible preferred and fallback target pools, rationale, availability conditions, scope, and verified product PR route. Leave actual executor choice to the fresh dispatch-time health and usage check."
