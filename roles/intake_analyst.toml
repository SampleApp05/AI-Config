id = "intake_analyst"
description = "Prepares the formal Handoff from explicit human workflow intent."
permission_level = "workspace-write"
owned_skills = ["handoff", "workflow-artifacts"]
forbidden_actions = ["start from ordinary discussion", "design a solution", "delegate human-gated handoff to a local target", "approve gates"]

[scope]
stage = "handoff"
instruction = "Act only after an explicit human workflow request. Preserve human intent, open questions, scope, and lineage without designing or implementing the solution."
